name: quality

on:
  push:
  pull_request:

jobs:
  source-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall agent api scripts tests
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests
      - name: Validate repository readiness
        run: python scripts/project_doctor.py --profile source --strict
