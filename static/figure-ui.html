<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG Agent | Evidence-Grounded Analysis Terminal</title>
    <link href="style.css" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar / Header Area -->
        <header class="chat-header glass-panel">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="icon-sparkle">
                    <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z" fill="currentColor"/>
                </svg>
                <h1>ESG Agent</h1>
            </div>
            <div class="header-actions">
                <a href="dashboard.html" class="nav-link" target="_blank">Observability Dashboard</a>
                <span class="status-badge" id="system-status">System Ready</span>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-main" id="chat-container">
            <div class="message system-message welcome-msg">
                <div class="avatar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="message-content">
                    <h3>Welcome to the ESG Evidence Analysis Terminal</h3>
                    <p>This LangGraph-based workflow analyses ESG evidence for selected companies in the automotive, banking and electric-power sectors using reports and structured data from 2022--2024.</p>
                    <div class="suggestion-chips">
                        <button class="chip" onclick="setInput('How did BYD Scope 1 emissions change from 2022 to 2024?')">BYD three-year emissions trend</button>
                        <button class="chip" onclick="setInput('How did ICBC green-finance balance change from 2022 to 2024?')">ICBC green finance</button>
                        <button class="chip" onclick="setInput('What was Huaneng International clean-energy share in 2024?')">Huaneng clean energy</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-footer glass-panel">
            <form id="chat-form" class="input-form">
                <div class="input-wrapper">
                    <textarea id="query-input" placeholder="Enter an ESG evidence question..." rows="1" autofocus></textarea>
                </div>
                <button type="submit" id="send-btn" class="send-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    
    <!-- JavaScript Application -->
</body>
</html>
